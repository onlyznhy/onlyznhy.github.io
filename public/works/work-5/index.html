<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work 5</title>
  <style>
:root {
  color: #111827;
  background: #f6f7f9;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f6f7f9; }
.topbar {
  align-items: center;
  backdrop-filter: blur(18px);
  background: rgba(255, 255, 255, 0.88);
  border-bottom: 1px solid rgba(17, 24, 39, 0.08);
  display: flex;
  gap: 16px;
  justify-content: space-between;
  left: 0;
  padding: 14px clamp(18px, 4vw, 48px);
  position: sticky;
  right: 0;
  top: 0;
  z-index: 20;
}
.brand { min-width: 0; }
.brand strong { display: block; font-size: 18px; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.nav a {
  border: 1px solid rgba(17, 24, 39, 0.1);
  border-radius: 999px;
  color: #111827;
  font-size: 13px;
  padding: 8px 12px;
  text-decoration: none;
}
.deck { display: grid; gap: clamp(18px, 3vw, 34px); margin: 0 auto; max-width: 1180px; padding: clamp(18px, 4vw, 42px); }
.slide {
  aspect-ratio: 16 / 9;
  background: #fff;
  border: 1px solid rgba(17, 24, 39, 0.08);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
  overflow: hidden;
  position: relative;
}
.slide > img { display: block; height: 100%; object-fit: cover; width: 100%; }
.slide video {
  background: #000;
  height: calc(var(--h) * 100%);
  left: calc(var(--x) * 100%);
  object-fit: cover;
  position: absolute;
  top: calc(var(--y) * 100%);
  width: calc(var(--w) * 100%);
  z-index: 2;
}
@media (max-width: 760px) {
  .topbar { align-items: flex-start; flex-direction: column; }
  .nav { justify-content: flex-start; }
  .deck { padding: 14px; }
  .slide { border-radius: 8px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Work 5</strong>
    </div>
    <nav class="nav" aria-label="Works navigation">
      <a href="../work-1/index.html">Work 1</a>
      <a href="../work-2/index.html">Work 2</a>
      <a href="../work-3/index.html">Work 3</a>
      <a href="../work-4/index.html">Work 4</a>
      <a href="../work-5/index.html">Work 5</a>
      <a href="../all/index.html">Portfolio</a>
      <a href="../../">Back to site</a>
    </nav>
  </header>
  <main class="deck">
    <section class="slide" id="slide-17">
      <img src="../assets/portfolio-slide-17.png" alt="Slide 17" loading="lazy">
    </section>
    <section class="slide" id="slide-18">
      <img src="../assets/portfolio-slide-18.png" alt="Slide 18" loading="lazy">
    </section>
    <section class="slide" id="slide-19">
      <img src="../assets/portfolio-slide-19.png" alt="Slide 19" loading="lazy">
    </section>
    <section class="slide" id="slide-20">
      <img src="../assets/portfolio-slide-20.png" alt="Slide 20" loading="lazy">
      <video src="../assets/work5-demo.mp4" autoplay muted loop playsinline preload="auto" controls style="--x:0.03979167;--y:0.09361053;--w:0.87444119;--h:0.88134441"></video>
    </section>
  </main>
  <script>
    const PLAYBACK_RATE = 2.2;
    const startVideo = video => {
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.defaultPlaybackRate = PLAYBACK_RATE;
      video.playbackRate = PLAYBACK_RATE;
      const playPromise = video.play();
      if (playPromise) playPromise.catch(() => {});
    };
    document.querySelectorAll('video').forEach(video => {
      startVideo(video);
      video.addEventListener('loadedmetadata', () => startVideo(video));
      video.addEventListener('canplay', () => startVideo(video));
      video.addEventListener('play', () => startVideo(video));
    });
    window.addEventListener('load', () => {
      requestAnimationFrame(() => document.querySelectorAll('video').forEach(startVideo));
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) document.querySelectorAll('video').forEach(startVideo);
    });
  </script>
</body>
</html>
