<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work 5</title>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.deck { display: grid; gap: 14px; justify-items: center; margin: 0; padding: 16px 18px 20px; width: 100%; }
.slide { aspect-ratio: 16 / 9; background: #fff; overflow: hidden; position: relative; width: min(92%, calc((100vh - 48px) * 16 / 9)); }
.slide > img { display: block; height: 100%; object-fit: cover; width: 100%; }
.slide > .demo-gif { height: calc(var(--h) * 100%); left: calc(var(--x) * 100%); object-fit: fill; position: absolute; top: calc(var(--y) * 100%); width: calc(var(--w) * 100%); z-index: 2; }
  </style>
</head>
<body>
  <main class="deck">
    <section class="slide" id="slide-01">
      <img src="assets/work5-current-19.png" alt="Slide 1" fetchpriority="high">
    </section>
    <section class="slide" id="slide-02">
      <img src="assets/work5-current-20.png" alt="Slide 2" loading="lazy">
    </section>
    <section class="slide" id="slide-03">
      <img src="assets/work5-current-21.png" alt="Slide 3" loading="lazy">
    </section>
    <section class="slide" id="slide-04">
      <img src="assets/work5-current-22.png" alt="Slide 4" loading="lazy">
      <img class="demo-gif" src="assets/work5-demo-3x.gif" alt="Logistics query demonstration" loading="lazy" style="--x:0.07203125;--y:0.10981481;--w:0.86479167;--h:0.86518519">
    </section>
    <section class="slide" id="slide-05">
      <img src="assets/work5-current-23.png" alt="Slide 5" loading="lazy">
    </section>
    <section class="slide" id="slide-06">
      <img src="assets/work5-current-24.png" alt="Slide 6" loading="lazy">
    </section>
    <section class="slide" id="slide-07">
      <img src="assets/work5-current-25.png" alt="Slide 7" loading="lazy">
    </section>
    <section class="slide" id="slide-08">
      <img src="assets/work5-current-26.png" alt="Slide 8" loading="lazy">
    </section>
    <section class="slide" id="slide-09">
      <img src="assets/work5-current-27.png" alt="Slide 9" loading="lazy">
    </section>
    <section class="slide" id="slide-10">
      <img src="assets/work5-current-28.png" alt="Slide 10" loading="lazy">
    </section>
    <section class="slide" id="slide-11">
      <img src="assets/work5-current-29.png" alt="Slide 11" loading="lazy">
    </section>
  </main>
</body>
</html>
